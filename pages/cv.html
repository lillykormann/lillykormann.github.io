<body>
  <main>

    <!-- no more need to insert nav as I moved it to nav.js -->
    
    <article>
      <h3 class="text-after">Curriculum Vitae</h3>
      My current CV can be downloaded <a href="../files/cv/cv_kormann_08_2026.pdf" download><i></i> here</a> or be viewed below.

      <!-- <a href="../files/cv_kormann_08_2026.pdf" class="button" target="_blank"><i class="fa-solid fa-eye"></i> View CV</a> -->
      <!-- <iframe src="../files/cv/cv_kormann_08_2026.pdf" class="cv-embed" title="Curriculum Vitae">          
        <p>Your browser doesn't support embedded PDFs. <a href="../files/cv/cv_kormann_08_2026.pdf" target="_blank"></a>.</p>

      <p></p>
      <div id="cv-container" class="cv-container"></div> 

      <!-- <a href="../files/cv_kormann_08_2026.pdf" class="button" download><i class="fa-solid fa-download"></i> Download CV</a>  -->
      
      </article>
      
      <!-- no more need to insert footer as I moved it to footer.js -->
     
  </main>

  <script src="../js/nav.js"></script>
  <script src="../js/footer.js"></script>
  <script src="../js/theme-toggle.js"></script>

  <script>                                                                                         
      pdfjsLib.GlobalWorkerOptions.workerSrc =                                                       
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';                  
                                                                                                     
      async function renderCV() {
        const container = document.getElementById('cv-container');
        const pdf = await pdfjsLib.getDocument('../files/cv/cv_kormann_08_2026.pdf').promise;

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const baseScale = container.clientWidth / page.getViewport({ scale: 1 }).width;
          const displayViewport = page.getViewport({ scale: baseScale });
          const renderViewport = page.getViewport({ scale: baseScale * Math.max(window.devicePixelRatio, 2) });

          // wrapper holds canvas + annotation layer stacked
          const wrapper = document.createElement('div');
          wrapper.style.position = 'relative';
          wrapper.style.width = '100%';
          wrapper.style.height = displayViewport.height + 'px';
          container.appendChild(wrapper);

          const canvas = document.createElement('canvas');
          canvas.width = renderViewport.width;
          canvas.height = renderViewport.height;
          canvas.style.position = 'absolute';
          canvas.style.width = '100%';
          canvas.style.height = '100%';
          wrapper.appendChild(canvas);

          await page.render({ canvasContext: canvas.getContext('2d'), viewport: renderViewport }).promise;

          // clickable links                                                                                                
          const annotations = await page.getAnnotations();                                                                  
          annotations
            .filter(a => a.subtype === 'Link' && a.url)                                                                     
            .forEach(annotation => {
              const [x1, y1, x2, y2] = displayViewport.convertToViewportRectangle(annotation.rect);
              const link = document.createElement('a');                                                                     
              link.href = annotation.url;
              link.target = '_blank';                                                                                       
              link.rel = 'noopener noreferrer';
              link.style.position = 'absolute';                                                                             
              link.style.left   = Math.min(x1, x2) + 'px';
              link.style.top    = Math.min(y1, y2) + 'px';                                                                  
              link.style.width  = Math.abs(x2 - x1) + 'px';                                                                 
              link.style.height = Math.abs(y2 - y1) + 'px';
              wrapper.appendChild(link);                                                                                    
            });  
        }
      }

    renderCV();
                                                                                   
  </script> 

</body>
</html>
